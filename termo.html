<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termos de Uso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Estilos específicos para o Termo A (Wall of text) */
        .wall-of-text {
            max-height: 50vh;
            overflow-y: auto;
            padding-right: 1rem;
        }
        
        /* Semântica Cromática do Termo B */
        .color-service { border-color: #3b82f6; background-color: #eff6ff; color: #1e40af; }
        .color-attention { border-color: #f97316; background-color: #fff7ed; color: #9a3412; }
        .color-security { border-color: #22c55e; background-color: #f0fdf4; color: #166534; }
        .color-critical { border-color: #ef4444; background-color: #fef2f2; color: #991b1b; }
        
        .icon-card { transition: all 0.3s ease; }
        .icon-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .toggle-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; border-radius: 0.25rem; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 flex items-center justify-center p-4 md:p-8">

    <main class="w-full max-w-4xl bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
        
        <div class="p-6 md:p-8 border-b border-slate-100 flex justify-between items-start bg-slate-50/50">
            <div>
                <h1 id="term-title" class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">Carregando...</h1>
                <p id="term-subtitle" class="text-sm text-indigo-600 font-medium mt-2 bg-indigo-50 inline-block px-3 py-1 rounded-full"></p>
            </div>
            <div class="text-right flex flex-col items-end">
                <span class="bg-slate-200 text-slate-600 py-1 px-2 rounded text-[10px] font-bold uppercase tracking-widest" id="badge-version"></span>
            </div>
        </div>

        <div class="p-6 md:p-8 bg-white w-full" id="term-content">
            </div>

        <div id="actions-container" class="p-6 md:p-8 bg-slate-50 border-t border-slate-100 flex flex-col sm:flex-row gap-4">
            </div>
        
    </main>

    
    <div id="lgpd-modal" class="fixed hidden z-50 bg-slate-900 text-white p-5 rounded-2xl shadow-2xl max-w-xs pointer-events-none transition-opacity duration-200 opacity-0">
        <div class="flex items-center gap-2 mb-2">
            <i data-lucide="scale" class="w-5 h-5 text-indigo-400"></i>
            <h3 id="lgpd-title" class="text-lg font-black text-indigo-400"></h3>
        </div>
        <p id="lgpd-desc" class="text-sm leading-relaxed text-slate-300"></p>
    </div>


    <script>
        // =========================================================
        // DADOS DO TERMO B (protótipo Visual Law)
        // =========================================================
        const taxonomyRegistry = [
            {
                id: "coleta_dados", label: "Coleta e Tipos de Dado", description: "Dados cadastrais necessários para executar o serviço.",
                icon: "database", colorClass: "color-service", type: "essential",
                legal: { lgpd: "Art. 5º", gdpr: "Art. 13", dpv: "dpv:PersonalData" }
            },
            {
                id: "finalidade", label: "Finalidade do Tratamento", description: "O motivo exato pelo qual precisamos dos seus dados.",
                icon: "target", colorClass: "color-service", type: "essential",
                legal: { lgpd: "Art. 6º I", gdpr: "Art. 5(1)(b)", dpv: "dpv:Purpose" }
            },
            {
                id: "compartilhamento", label: "Compartilhamento", description: "Envio de dados para terceiros e parceiros comerciais.",
                icon: "share-2", colorClass: "color-attention", type: "optional",
                legal: { lgpd: "Art. 7º §5º", gdpr: "Art. 13(1)(e)", dpv: "dpv:Recipient" }
            },
            {
                id: "cookies_rastreamento", label: "Cookies e Rastreamento", description: "Monitoramento de comportamento para anúncios.",
                icon: "cookie", colorClass: "color-attention", type: "optional",
                legal: { lgpd: "Art. 7º", gdpr: "ePrivacy", dpv: "dpv:Tracking" }
            },
            {
                id: "transferencia_int", label: "Transferência Internacional", description: "Armazenamento em servidores fora do seu país.",
                icon: "globe", colorClass: "color-attention", type: "info",
                legal: { lgpd: "Art. 33", gdpr: "Art. 44", dpv: "dpv:DataTransfer" }
            },
            {
                id: "ia_decisoes", label: "Decisões e IA", description: "Uso de Inteligência Artificial para traçar seu perfil.",
                icon: "cpu", colorClass: "color-critical", type: "optional",
                legal: { lgpd: "Art. 20", gdpr: "Art. 22", dpv: "dpv:AutomatedDecision" }
            },
            {
                id: "seguranca", label: "Segurança da Informação", description: "Criptografia e proteção contra acessos indevidos.",
                icon: "shield", colorClass: "color-security", type: "info",
                legal: { lgpd: "Art. 46", gdpr: "Art. 32", dpv: "dpv:SecurityMeasure" }
            },
            {
                id: "retencao", label: "Retenção e Descarte", description: "Por quanto tempo guardamos suas informações.",
                icon: "clock", colorClass: "color-info", type: "info",
                legal: { lgpd: "Art. 15", gdpr: "Art. 13(2)", dpv: "dpv:StorageDuration" }
            },
            {
                id: "direitos", label: "Direitos do Titular", description: "Seu direito de ver, corrigir ou portar seus dados.",
                icon: "user-check", colorClass: "color-security", type: "info",
                legal: { lgpd: "Art. 18", gdpr: "Art. 15 ao 22", dpv: "dpv:DataSubjectRight" }
            },
            {
                id: "base_legal", label: "Base Legal", description: "A justificativa jurídica para processarmos o dado.",
                icon: "scale", colorClass: "color-service", type: "info",
                legal: { lgpd: "Art. 7º", gdpr: "Art. 6º", dpv: "dpv:LegalBasis" }
            },
            {
                id: "dpo_contato", label: "Contato do DPO", description: "Fale com o encarregado de proteção de dados.",
                icon: "mail", colorClass: "color-service", type: "info",
                legal: { lgpd: "Art. 41", gdpr: "Art. 37", dpv: "dpv:DPO" }
            },
            {
                id: "alteracoes", label: "Alterações da Política", description: "Como avisaremos se estas regras mudarem.",
                icon: "history", colorClass: "color-service", type: "info",
                legal: { lgpd: "Art. 8º", gdpr: "Art. 13", dpv: "dpv:PolicyChange" }
            }
        ];

        // Dicionário de Explicações (LGPD, GDPR, DPV)
        const legalDb = {
            "lgpd": "A Lei Geral de Proteção de Dados (Brasil) regula esta atividade, garantindo proteção e direitos ao cidadão brasileiro.",
            "gdpr": "O Regulamento Geral de Proteção de Dados (União Europeia) é o padrão ouro global que fundamenta esta cláusula.",
            "dpv": "Data Privacy Vocabulary (W3C). Esta é uma marcação de metadados legível por máquina para garantir interoperabilidade de sistemas."
        };

        // Funções para mostrar e esconder a modal da LGPD
        window.showLegalModal = function(framework, reference) {
            const modal = document.getElementById('legal-modal');
            document.getElementById('legal-title').innerText = `${framework.toUpperCase()} - ${reference}`;
            document.getElementById('legal-desc').innerText = legalDb[framework.toLowerCase()] || "Fundamentação regulatória.";
            
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        };

        window.hideLgpdModal = function() {
            const modal = document.getElementById('lgpd-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        };

        // Faz a modal seguir o mouse
        document.addEventListener('mousemove', (e) => {
            const modal = document.getElementById('lgpd-modal');
            if (!modal.classList.contains('hidden')) {
                modal.style.left = (e.clientX + 15) + 'px';
                modal.style.top = (e.clientY + 15) + 'px';
            }
        });

        // Gera as tags de cards para o Termo B (Agora com os eventos de Mouse)
        const cardsHTML = taxonomyRegistry.map(item => {
            let controlUI = '';

            if (cardStyle === 'color-info') {
                cardStyle = 'border-slate-200 bg-slate-50 text-slate-700';
            }

            if (item.type === 'essential') {
                controlUI = `<span class="mt-3 inline-block text-[10px] font-bold uppercase tracking-wider bg-white/70 px-2 py-1 rounded shadow-sm opacity-90">Essencial (Sem Opt-out)</span>`;
            } else if (item.type === 'info') {
                controlUI = `<span class="mt-3 inline-block text-[10px] font-bold uppercase tracking-wider bg-white/70 px-2 py-1 rounded shadow-sm opacity-90">Informativo</span>`;
            } else if (item.type === 'optional') {
                controlUI = `
                    <label class="mt-3 flex items-center gap-2 cursor-pointer font-bold text-[11px] uppercase tracking-wide bg-white/50 p-2 rounded hover:bg-white/80 transition-colors">
                        <input type="checkbox" class="toggle-checkbox accent-current"> Permitir
                    </label>`;
            }

            return `
                <div class="icon-card p-5 border-2 rounded-2xl flex flex-col justify-between ${cardStyle}">
                    <div>
                        <div class="flex items-center gap-3 mb-2">
                            <div class="p-2 bg-white/90 rounded-lg shadow-sm"><i data-lucide="${item.icon}" class="w-6 h-6"></i></div>
                            <span class="font-black text-[13px] uppercase tracking-tight leading-tight">${item.label}</span>
                        </div>
                        <p class="text-xs mt-2 opacity-90 leading-relaxed font-medium">${item.description}</p>
                        
                        <div class="flex gap-1.5 mt-3 flex-wrap">
                            <span class="group relative bg-blue-100/50 text-blue-800 px-1.5 py-0.5 rounded text-[9px] font-bold uppercase border border-blue-200/50 cursor-help"
                                  onmouseenter="showLegalModal('lgpd', '${item.legal.lgpd}')" onmouseleave="hideLegalModal()">
                                LGPD
                            </span>
                            <span class="group relative bg-indigo-100/50 text-indigo-800 px-1.5 py-0.5 rounded text-[9px] font-bold uppercase border border-indigo-200/50 cursor-help"
                                  onmouseenter="showLegalModal('gdpr', '${item.legal.gdpr}')" onmouseleave="hideLegalModal()">
                                GDPR
                            </span>
                            <span class="group relative bg-emerald-100/50 text-emerald-800 px-1.5 py-0.5 rounded text-[9px] font-bold uppercase border border-emerald-200/50 cursor-help"
                                  onmouseenter="showLegalModal('dpv', '${item.legal.dpv}')" onmouseleave="hideLegalModal()">
                                DPV
                            </span>
                        </div>
                    </div>
                    <div>${controlUI}</div>
                </div>
            `;
        }).join('');

        // =========================================================
        // BANCO DE TERMOS (A = Tradicional / B = Visual Law)
        // =========================================================
        const termosDb = {
            'A': {
                title: 'Termos de Uso e Política de Privacidade',
                subtitle: 'Contrato de Adesão Padrão',
                badge: 'v1.0 Tradicional',
                // TEXTO MASSIVO (Grupo de Controle)
                content: `
                    <div class="wall-of-text text-sm text-justify text-slate-600 space-y-4 pr-4">
                        <p><strong>BEM-VINDO AOS TERMOS DE USO. LEIA ESTE DOCUMENTO COM ATENÇÃO.</strong></p>
                        <p>1. DA ACEITAÇÃO: Ao marcar a caixa de seleção e clicar no botão "Aceito", o USUÁRIO declara ter lido, compreendido e aceitado todos os termos e condições aqui estabelecidos. O não aceite implica na impossibilidade categórica de uso dos serviços ofertados.</p>
                        <p>2. DA COLETA DE DADOS: O PROVEDOR coletará, de forma irrestrita, dados pessoais do USUÁRIO, incluindo, mas não se limitando a: nome completo, endereço, CPF, RG, dados bancários, endereço de IP, geolocalização contínua, histórico de navegação, preferências de consumo, interações em redes sociais, metadados de comunicação, biometria facial e padrões de digitação.</p>
                        <p>3. DO COMPARTILHAMENTO COM TERCEIROS: O USUÁRIO autoriza expressamente o compartilhamento, a título oneroso ou gratuito, de seus dados com empresas parceiras, subsidiárias, afiliadas, redes de publicidade, birôs de crédito e autoridades governamentais, para fins de marketing direcionado, análise de perfil (profiling), cruzamento de dados e quaisquer outras finalidades que o PROVEDOR julgar necessárias, inclusive com transferência internacional de dados para países sem legislação de proteção equivalente.</p>
                        <p>4. DA PROPRIEDADE INTELECTUAL: Todo o conteúdo gerado, publicado, carregado ou transmitido pelo USUÁRIO através da plataforma torna-se, de forma irrevogável, irretratável, gratuita, global e perpétua, propriedade exclusiva do PROVEDOR, que poderá utilizá-lo, modificá-lo, sublicenciá-lo e comercializá-lo sem necessidade de aviso prévio ou compensação financeira.</p>
                        <p>5. DA ISENÇÃO DE RESPONSABILIDADE: O PROVEDOR não se responsabiliza, sob nenhuma hipótese, por vazamentos de dados resultantes de ataques cibernéticos, falhas de sistema, interceptações ilegais ou culpa exclusiva de terceiros, cabendo ao USUÁRIO o risco integral e absoluto da utilização da plataforma e da submissão de suas informações.</p>
                        <p>6. DAS ALTERAÇÕES DO TERMO: O PROVEDOR reserva-se o direito unilateral de alterar, modificar, adicionar ou remover partes destes termos a qualquer momento, sem notificação prévia. O uso contínuo da plataforma configurará aceite automático, incondicional e tácito das novas versões publicadas.</p>
                        <p>7. DA RETENÇÃO DE DADOS: Os dados coletados serão armazenados por tempo indeterminado, mesmo após o encerramento da conta do USUÁRIO, para fins de auditoria, conformidade legal, treinamentos de algoritmos de inteligência artificial e análises preditivas próprias da empresa matriz.</p>
                        <p>8. FORO: Elege-se o foro da comarca da sede do PROVEDOR, preterindo qualquer outro, para dirimir quaisquer dúvidas oriundas deste instrumento, com renúncia expressa do USUÁRIO a qualquer outro, por mais privilegiado que seja, arcando o USUÁRIO com todas as custas processuais caso ajuíze demanda perdedora.</p>
                    </div>
                    <div class="mt-6 border-t pt-5">
                        <label class="flex items-start gap-3 cursor-pointer p-4 bg-slate-50 rounded-lg border border-slate-300 hover:bg-slate-100 transition-colors">
                            <input type="checkbox" id="checkTermoA" class="w-5 h-5 mt-0.5 accent-indigo-600 rounded" onchange="toggleButtonA()">
                            <span class="font-bold text-slate-700 text-sm leading-tight">Eu li e compreendi o texto longo acima e concordo integralmente com todas as disposições descritas de coleta, compartilhamento e uso de imagem.</span>
                        </label>
                    </div>
                `,
                actions: `
                    <button type="button" onclick="registerDecision(false)" class="flex-1 px-6 py-4 border-2 border-slate-200 rounded-2xl text-slate-500 font-bold hover:bg-slate-100 transition-colors">Não Aceitar e Sair</button>
                    <button type="button" id="btnAcceptA" onclick="registerDecision(true)" class="flex-[2] bg-indigo-600 text-white px-8 py-4 rounded-2xl font-black opacity-50 cursor-not-allowed transition-all text-center" disabled>Concordar e Enviar</button>
                `
            },
            'B': {
                title: 'Privacidade Transparente',
                subtitle: 'Nós valorizamos sua privacidade. Ajuste abaixo o que faz sentido para você.',
                badge: 'v2.1.0 Visual Law',
                // CARDS COM ÍCONES (Grupo Experimental)
                content: `
                    <p class="text-slate-500 text-sm mb-6 font-medium">Controle como seus dados são utilizados. Finalidades essenciais já estão garantidas para a prestação do serviço principal.</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${cardsHTML}
                    </div>
                `,
                actions: `
                    <button type="button" onclick="registerDecision(false)" class="flex-1 px-6 py-4 border-2 border-slate-200 rounded-2xl text-slate-500 font-bold hover:bg-slate-100 hover:text-slate-800 transition-colors">Recusar Opcionais</button>
                    <button type="button" onclick="registerDecision(true)" class="flex-[2] bg-indigo-600 text-white px-8 py-4 rounded-2xl font-black shadow-xl shadow-indigo-200 hover:bg-indigo-700 active:scale-95 transition-all text-center">Confirmar Preferências</button>
                `
            }
        };

        // Função para liberar o botão do Termo A apenas se marcar a caixa
        window.toggleButtonA = function() {
            const btn = document.getElementById('btnAcceptA');
            const check = document.getElementById('checkTermoA');
            if (check.checked) {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.classList.add('hover:bg-indigo-700', 'active:scale-95', 'shadow-xl', 'shadow-indigo-200');
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('hover:bg-indigo-700', 'active:scale-95', 'shadow-xl', 'shadow-indigo-200');
            }
        };

        // Carrega a interface correta baseada na URL
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tipo = urlParams.get('tipo') || 'A';
            
            document.getElementById('term-title').innerText = termosDb[tipo].title;
            document.getElementById('term-subtitle').innerText = termosDb[tipo].subtitle;
            document.getElementById('badge-version').innerText = termosDb[tipo].badge;
            document.getElementById('badge-iso').innerText = termosDb[tipo].isoBadge;
            document.getElementById('term-content').innerHTML = termosDb[tipo].content;
            document.getElementById('actions-container').innerHTML = termosDb[tipo].actions;

            // Instancia os ícones do Lucide no HTML injetado
            lucide.createIcons();
        });
    </script>

    <script src="telemetry.js"></script>
</body>

</html>
