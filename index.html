<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Termos de Uso</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background:#f0f4f8; color:#0f172a; }
        .page { display:flex; min-height:100vh; align-items:center; justify-content:center; padding:2rem; }
        .card { background:#fff; border-radius:16px; box-shadow:0 20px 80px rgba(15,23,42,.08); width:100%; max-width:900px; padding:2rem; }
        h1 { margin:0 0 1rem; font-size:2rem; }
        p { color:#475569; line-height:1.7; }
        .choices { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; margin:2rem 0; }
        .choice { display:flex; flex-direction:column; padding:1.5rem; border-radius:14px; background:#eff6ff; border:1px solid #c7d2fe; text-decoration:none; color:#1d4ed8; font-weight:700; transition:transform .18s ease, box-shadow .18s ease; }
        .choice:hover { transform:translateY(-3px); box-shadow:0 14px 35px rgba(15,23,42,.12); }
        .choice span { margin-top:0.5rem; font-size:0.95rem; font-weight:400; color:#475569; }
        .controls { display:flex; justify-content:flex-end; gap:1rem; }
        .button { display:inline-flex; align-items:center; justify-content:center; padding:0.95rem 1.4rem; border-radius:10px; border:none; background:#2563eb; color:#fff; text-decoration:none; font-weight:700; }
        .button.secondary { background:#64748b; }
    </style>
</head>
<body>
<div class="page">
    <section class="card">
        <h1>Escolha o termo de uso</h1>
        <p>Selecione a variante A ou B para exibir o termo de compromisso correspondente.</p>
        <div class="choices">
            <a class="choice" href="termo.html?tipo=A">
                Termo A
                <span>Versão padrão com linguagem direta e foco em clareza.</span>
            </a>
            <a class="choice" href="termo.html?tipo=B">
                Termo B
                <span>Versão alternativa com foco em contexto visual e transparência.</span>
            </a>
        </div>
        <div class="controls">
            <a class="button secondary" href="logs.html">Ver logs registrados</a>
        </div>
    </section>
</div>
</body>
</html>
