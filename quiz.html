<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Compreensão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .question-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .option-label { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .option-label:hover { background: #f1f5f9; }
        input[type="radio"]:checked + span { font-weight: bold; color: #4f46e5; }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center">

    <div class="max-w-3xl w-full">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-black text-slate-900">Teste de Compreensão</h1>
            <p class="text-slate-500 mt-2">Responda às perguntas abaixo baseando-se nos Termos que você acabou de ler.</p>
        </div>

        <form id="quizForm">
            <div id="questionsContainer"></div>
            <button id="submitBtn" type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-xl shadow-lg hover:bg-indigo-700 transition-all mt-6 flex justify-center items-center gap-2">
                Finalizar e Registrar Respostas
            </button>
        </form>

        <div id="resultScreen" class="hidden text-center bg-white p-8 rounded-2xl shadow-xl border border-slate-200 mt-8">
            <i data-lucide="check-circle" class="w-16 h-16 text-green-500 mx-auto mb-4"></i>
            <h2 class="text-2xl font-black text-slate-900">Registro Concluído!</h2>
            <p class="text-lg text-slate-600 mt-2">Sua pontuação de compreensão: <span id="scoreDisplay" class="font-black text-indigo-600 text-3xl"></span>/7</p>
            <p class="text-sm text-slate-500 mt-4">Os dados do seu tempo de leitura e nota foram salvos para a pesquisa.</p>
            
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabaseClient.js';
        lucide.createIcons();
        
        // Perguntas Universais (Testam a eficácia da comunicação de ambos os modelos)
        const questions = [
            { q: "1. O fornecimento de dados básicos de cadastro é obrigatório para usar o serviço?", options: ["Sim, não é possível usar sem eles.", "Não, o aplicativo funciona 100% anonimamente.", "Sim, mas eu sou pago por isso."], answer: 0 },
            { q: "2. Com relação ao compartilhamento de dados com empresas terceiras, qual é a finalidade informada?", options: ["Para fins de investigações policiais.", "Para fins de marketing parceiro e publicidade.", "A empresa garante que nunca compartilha com terceiros."], answer: 1 },
            { q: "3. O aplicativo realiza o rastreamento da sua localização física (GPS)?", options: ["Não, é proibido por lei.", "Sim, rastreia em tempo real para recursos extras.", "Apenas o CEP da residência."], answer: 1 },
            { q: "4. Sobre a segurança das suas informações, o termo afirma que o aplicativo utiliza:", options: ["Criptografia de ponta e proteção contra fraudes.", "Apenas senhas básicas de 4 dígitos.", "Nenhuma medida tecnológica."], answer: 0 },
            { q: "5. Se você decidir parar de usar o serviço, o que você tem o direito de solicitar?", options: ["A exclusão e eliminação definitiva dos seus dados.", "Que os dados fiquem congelados por 10 anos.", "Transferir a conta para outra pessoa."], answer: 0 },
            { q: "6. Sobre o conteúdo (textos, fotos) que você gera na plataforma, de quem são os direitos de uso?", options: ["Ficam em domínio público.", "A empresa passa a ter licença e propriedade sobre eles.", "Pertencem ao governo federal."], answer: 1 },
            { q: "7. A permissão para rastrear o seu GPS é classificada no termo como:", options: ["Um dado essencial (obrigatório).", "Uma permissão opcional (Opt-in).", "Um dado que não existe."], answer: 1 }
        ];

        const container = document.getElementById('questionsContainer');
        questions.forEach((qObj, index) => {
            let optionsHtml = '';
            qObj.options.forEach((opt, optIdx) => {
                optionsHtml += `
                    <label class="option-label">
                        <input type="radio" name="q${index}" value="${optIdx}" class="accent-indigo-600" required>
                        <span>${opt}</span>
                    </label>
                `;
            });
            container.innerHTML += `<div class="question-card"><p class="font-bold text-slate-800 mb-3">${qObj.q}</p><div class="flex flex-col gap-2">${optionsHtml}</div></div>`;
        });

        document.getElementById('quizForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 1. Desabilita todos os inputs imediatamente
            const inputs = document.querySelectorAll('input[type="radio"]');
            inputs.forEach(input => input.disabled = true);
            
            // 2. Esconde o botão de envio
            const btn = document.getElementById('submitBtn');
            btn.style.display = 'none';
            btn.innerHTML = 'Salvando...';

            let score = 0;
            questions.forEach((qObj, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected && parseInt(selected.value) === qObj.answer) score++;
            });

            const tempConsent = JSON.parse(sessionStorage.getItem('temp_consent'));
            if (!tempConsent) {
                alert('Erro: Sessão expirada.');
                return;
            }

            try {
                const { error } = await supabase
                    .from('ConsentRecords')
                    .insert([{
                        user_id: tempConsent.user_id,
                        experimental_group: tempConsent.experimental_group,
                        has_accepted: tempConsent.has_accepted,
                        latency_milliseconds: tempConsent.latency_milliseconds,
                        quiz_score: score
                    }]);

                if (error) throw error;

                // 3. Trava o fluxo: Adiciona estado ao histórico para impedir o "Voltar"
                history.pushState(null, null, location.href);
                window.onpopstate = function () {
                    history.go(1);
                };

                // Mostra o resultado
                document.getElementById('quizForm').classList.add('hidden');
                document.getElementById('resultScreen').classList.remove('hidden');
                document.getElementById('scoreDisplay').innerText = score;
                
                sessionStorage.removeItem('temp_consent');

            } catch (err) {
                console.error(err);
                alert('Falha ao salvar. Tente novamente.');
                btn.style.display = 'flex';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
