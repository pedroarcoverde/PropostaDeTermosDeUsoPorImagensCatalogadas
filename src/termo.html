<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termos de Uso</title>
    <style>
        body { margin:0; font-family:'Segoe UI',sans-serif; background:#f8fafc; color:#0f172a; }
        .page { display:flex; min-height:100vh; align-items:center; justify-content:center; padding:2rem; }
        .card { width:100%; max-width:860px; background:#fff; border-radius:18px; padding:2rem; box-shadow:0 20px 70px rgba(15,23,42,.08); }
        h1 { margin:0 0 1rem; font-size:2rem; }
        .term-content { margin:1.5rem 0; color:#334155; line-height:1.7; }
        .term-content p, .term-content ul { margin:0 0 1rem; }
        .term-content ul { padding-left:1.25rem; }
        .term-content li { margin:0.4rem 0; }
        .actions { display:flex; gap:1rem; justify-content:flex-end; margin-top:2rem; }
        .button { padding:0.85rem 1.4rem; border:none; border-radius:12px; font-weight:700; cursor:pointer; }
        .btn-decline { background:#ef4444; color:#fff; }
        .btn-accept { background:#2563eb; color:#fff; }
        .back { display:inline-block; margin-top:1rem; color:#475569; text-decoration:none; }
    </style>
</head>
<body>
<div class="page">
    <section class="card">
        <h1 id="term-title">Carregando termo...</h1>
        
        <div class="term-content" id="term-content">
            </div>

        <div class="actions">
            <button type="button" class="button btn-decline" onclick="registerDecision(false)">Recusar</button>
            <button type="button" class="button btn-accept" onclick="registerDecision(true)">Li e Aceito</button>
        </div>
        <a class="back" href="index.html">Voltar para seleção de termo</a>
    </section>
</div>

<script>
    // Aqui você configura os textos dos seus Termos! (Pode colocar HTML, links, etc)
    const termosDb = {
        'A': {
            title: 'Termos de Uso - Variante A (Padrão)',
            content: '<p>Este é o texto do modelo de controle. Insira aqui o texto massivo, denso e tradicional de termos de uso.</p><ul><li>Regra 1</li><li>Regra 2</li></ul>'
        },
        'B': {
            title: 'Termos de Uso - Variante B (Visual Law)',
            content: '<p>Este é o texto do grupo experimental. Insira aqui suas imagens, ícones e explicações claras (o foco do seu TCC).</p><ul><li>Exemplo Visual 1</li><li>Exemplo Visual 2</li></ul>'
        }
    };

    // Lê a URL (ex: termo.html?tipo=B) e preenche a tela
    const urlParams = new URLSearchParams(window.location.search);
    const tipo = urlParams.get('tipo') || 'A';
    
    document.getElementById('term-title').innerText = termosDb[tipo].title;
    document.getElementById('term-content').innerHTML = termosDb[tipo].content;
</script>

<script type="module" src="telemetry.js"></script>
</body>
</html>
