name: Deploy to Fly
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Build and publish
        run: |
          dotnet restore
          dotnet publish -c Release -o out
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | FLYCTL_INSTALL=/usr/local sh
          /usr/local/bin/flyctl version || true
      - name: Authenticate Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          /usr/local/bin/flyctl auth login --token "$FLY_API_TOKEN"
      - name: Create Fly app (if missing)
        env:
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        run: |
          /usr/local/bin/flyctl apps create "$FLY_APP_NAME" --region iad || true
      - name: Deploy to Fly
        env:
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        run: |
          /usr/local/bin/flyctl deploy --config fly.toml --app "$FLY_APP_NAME"
