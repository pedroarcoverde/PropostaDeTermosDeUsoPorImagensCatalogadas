name: Deploy to Fly
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Build and publish
        run: |
          dotnet restore
          dotnet publish -c Release -o out
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | FLYCTL_INSTALL=/usr/local sh
          flyctl version || true
      - name: Create Fly app (if missing)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth token $FLY_API_TOKEN || true
          flyctl apps create "${{ secrets.FLY_APP_NAME }}" || true
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth token $FLY_API_TOKEN || true
          flyctl deploy --config fly.toml --app "${{ secrets.FLY_APP_NAME }}"
